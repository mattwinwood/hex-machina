<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0410" />

    <!-- Installable. iOS needs the apple-* tags: it ignores the manifest's
         display mode, and without them "Add to Home Screen" opens a Safari
         chrome-wrapped page instead of the game full screen. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daily Hex" />
    <title>Daily Hex</title>
    <meta name="description" content="Daily Hex — a browser take on Super Hexagon: dodge the closing walls, survive 60 seconds." />
    <link rel="canonical" href="https://dailyhexagon.com/" />

    <!-- Link previews. The logo doubles as the share card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Daily Hex" />
    <meta property="og:title" content="Daily Hex" />
    <meta property="og:description" content="Dodge the closing walls. Survive 60 seconds. A new seeded run every day." />
    <meta property="og:url" content="https://dailyhexagon.com/" />
    <meta property="og:image" content="https://dailyhexagon.com/assets/wordmark.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daily Hex" />
    <meta name="twitter:description" content="Dodge the closing walls. Survive 60 seconds. A new seeded run every day." />
    <meta name="twitter:image" content="https://dailyhexagon.com/assets/wordmark.png" />

    <!-- Ahead of the stylesheet: the canvas binds a font at draw time, so the
         sooner this lands the fewer frames are laid out against a fallback. -->
    <link rel="preload" href="/assets/archivo-black.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,3 27,9.5 27,22.5 16,29 5,22.5 5,9.5' fill='none' stroke='%23ff5ce0' stroke-width='4'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="game" aria-label="Daily Hex game"></canvas>
    <div id="safe"></div>

    <!-- Name capture for the leaderboard. Canvas cannot take text input, so this
         is a real form element shown only when a score qualifies. -->
    <div id="nameEntry" hidden>
      <form id="nameForm">
        <p id="nameScore"></p>
        <label for="nameInput">NAME FOR THE LEADERBOARD</label>
        <input id="nameInput" name="name" maxlength="16" autocomplete="nickname"
               autocapitalize="characters" spellcheck="false" placeholder="ENTER NAME" />
        <div class="row">
          <button type="submit" id="nameSubmit">SUBMIT</button>
          <button type="button" id="nameSkip">SKIP</button>
        </div>
      </form>
    </div>
    <noscript>
      <p class="noscript">This game needs JavaScript enabled.</p>
    </noscript>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
